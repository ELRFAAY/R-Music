name: Release APK (signed)

# Manual: Actions > "Release APK (signed)" > Run workflow. Signs with the permanent key kept in
# the repository secrets SIGNING_KEYSTORE_GITHUB / SIGNING_PROPERTIES_GITHUB (never in the repo).
on:
  workflow_dispatch:
  push:
    branches: [ release ]  # push the branch "release" to build a signed APK

env:
  SIGNING_KEYSTORE_GITHUB: ${{ secrets.SIGNING_KEYSTORE_GITHUB }}
  SIGNING_PROPERTIES_GITHUB: ${{ secrets.SIGNING_PROPERTIES_GITHUB }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the signing secrets exist
        run: |
          if [ -z "$SIGNING_KEYSTORE_GITHUB" ] || [ -z "$SIGNING_PROPERTIES_GITHUB" ]; then
            echo "::error::Add the repository secrets SIGNING_KEYSTORE_GITHUB and SIGNING_PROPERTIES_GITHUB first"; exit 1
          fi
      - name: Setup signing
        run: ./ci_signing_setup.sh
      - name: Build the release APK
        run: ./gradlew :app:assembleNormalRelease
      - name: Name the APK after the app
        run: |
          mkdir -p out
          cp app/build/outputs/apk/normal/release/*.apk "out/R-Music-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: R-Music-release-apk
          path: out/*.apk
